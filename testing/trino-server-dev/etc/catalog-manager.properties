# MySQL Catalog Manager Configuration
# This file contains configuration for the MySQL-based catalog manager plugin

# MySQL Database Configuration for Local Development
mysql.jdbc-url=jdbc:mysql://localhost:3306/catalogs
mysql.username=root
mysql.password=

# Catalog refresh interval in milliseconds (30 seconds)
mysql.refresh-interval=30000

# For production, use environment variables:
# mysql.username=${ENV:MYSQL_USER}
# mysql.password=${ENV:MYSQL_PASSWORD}

# Database schema will be created automatically with these tables:
# - connectors: stores connector metadata and properties schemas
# - catalog_configurations: stores catalog configurations with versioning
